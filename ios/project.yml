# InFocus Portal for iPhone and iPad. Generate the Xcode project with
#   cd ios && xcodegen
# (InFocusPortal.xcodeproj is generated and gitignored.)
name: InFocusPortal
options:
  bundleIdPrefix: com.infocuspaly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Portal.xcconfig
  Release: Config/Portal.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(INFOCUS_TEAM_ID)
targets:
  InFocusPortal:
    type: application
    platform: iOS
    sources:
      - path: InFocusPortal
    info:
      path: InFocusPortal/Info.plist
      properties:
        CFBundleDisplayName: InFocus Portal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        InFocusPortalURL: https://$(INFOCUS_PORTAL_HOST)
        InFocusDriveURL: https://$(INFOCUS_DRIVE_HOST)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIAppFonts: [Lexend.ttf]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Take a photo or record a video to upload to the InFocus Portal.
        NSMicrophoneUsageDescription: Record sound with videos you upload to the InFocus Portal.
        NSPhotoLibraryUsageDescription: Choose photos and videos to upload to the InFocus Portal.
        NSPhotoLibraryAddUsageDescription: Save photos and videos from the InFocus Portal to your library.
    entitlements:
      path: InFocusPortal/InFocusPortal.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infocuspaly.portal
        PRODUCT_NAME: InFocusPortal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  InFocusPortalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InFocusPortalTests
    dependencies:
      - target: InFocusPortal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infocuspaly.portal.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  InFocusPortal:
    build:
      targets:
        InFocusPortal: all
        InFocusPortalTests: [test]
    test:
      targets: [InFocusPortalTests]
    archive:
      config: Release
