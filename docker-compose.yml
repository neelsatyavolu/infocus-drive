services:
  infocus-drive:
    build: .
    image: infocus-drive:local
    container_name: infocus-drive
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set it in .env (see .env.example)}
      LAN_ORIGIN: ${LAN_ORIGIN?set it in .env (see .env.example)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?set it in .env (see .env.example)}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      EMAIL_SIGN_IN_DB_PATH: /config/email_sign_in.sqlite3
      CLI_TOKENS_DB_PATH: /config/cli_tokens.sqlite3
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:?set it in .env (see .env.example)}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN?set it in .env (see .env.example)}
      DRIVE_ROOT: /data/volume2/InFocus Drive
      SHARES_VOLUME: /data/volume2
      SHARES_VOLUMES: /data/volume1,/data/volume2
      EXTRA_SHARES_DIR: /data/extra
      SAMBA_SHARES_CONF: /config/smbshare.conf
      USER_MAP_PATH: /config/user_map.json
      UGOS_ADMIN_PATH: ${UGOS_ADMIN_PATH?set it in .env (see .env.example)}
      UGOS_SSO_ENABLED: ${UGOS_SSO_ENABLED:-true}
      SMB_HOST: ${SMB_HOST?set it in .env (see .env.example)}
      WARP_TEAM_NAME: ${WARP_TEAM_NAME?set it in .env (see .env.example)}
      WARP_ENROLL_URL: ${WARP_ENROLL_URL?set it in .env (see .env.example)}
      PACKAGES_SERVICE_TOKEN: ${PACKAGES_SERVICE_TOKEN:-}
      PACKAGES_SERVICE_USER: ${PACKAGES_SERVICE_USER:-}
      PACKAGES_ROOT: ${PACKAGES_ROOT:-Package Cycles}
      PACKAGES_ROSTER_URL: ${PACKAGES_ROSTER_URL?set it in .env (see .env.example)}
      UGOS_API_URL: ${UGOS_API_URL:-http://127.0.0.1:9999}
      UGOS_ADMIN_USER: ${UGOS_ADMIN_USER?set it in .env (see .env.example)}
      UGOS_ADMIN_PASSWORD: ${UGOS_ADMIN_PASSWORD:-}
      UGOS_SYNC_GROUP: ${UGOS_SYNC_GROUP:-InFocus Members}
      USERD_URL: ${USERD_URL:-http://127.0.0.1:8791}
      USERD_TOKEN: ${USERD_TOKEN:-}
      USER_SYNC_PROTECTED_USERNAMES: ${USER_SYNC_PROTECTED_USERNAMES:?set it in .env (see .env.example)}
      USER_SYNC_PROTECTED_EMAILS: ${USER_SYNC_PROTECTED_EMAILS:?set it in .env (see .env.example)}
    volumes:
      # All data volumes so Camp MAC / Archive / docker (vol1) and InFocus Drive (vol2) are visible.
      - "/volume1:/data/volume1"
      - "/volume2:/data/volume2"
      # UGOS personal folders (`[personal_folder] path = %H` in smbshare.conf).
      # Follow UGOS encrypted-home unlock/relock mounts from the host.
      - "/home:/data/home:rslave"
      # Samba share table (valid users / write list / paths) — matches UGOS shared-folder list.
      - "/etc/samba/smbshare.conf:/config/smbshare.conf:ro"
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      # Directory bind so newly created UGOS users are visible without restart
      # (file binds of /etc/passwd go stale after atomic rewrite).
      - /etc:/host-etc:ro
      - ./config:/config
    cap_add:
      - SETUID
      - SETGID
    user: "0:0"
    # Detect freezes; pair with entrypoint watchdog (Docker does not auto-restart
    # on unhealthy for restart: unless-stopped alone).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8787/api/health"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 25s

  infocus-userd:
    build:
      context: .
      dockerfile: userd/Dockerfile
    image: infocus-userd:local
    container_name: infocus-userd
    restart: unless-stopped
    network_mode: host
    pid: host
    privileged: true
    env_file:
      - .env
    environment:
      USERD_BIND: 127.0.0.1
      USERD_PORT: "8791"
      USERD_TOKEN: ${USERD_TOKEN:-}
      USER_SYNC_PROTECTED_USERNAMES: ${USER_SYNC_PROTECTED_USERNAMES:?set it in .env (see .env.example)}
      USERD_PRIMARY_GID: "100"
      USERD_UID_INCR: /ugreen/.config/userid.incr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    container_name: infocus-drive-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - infocus-drive
